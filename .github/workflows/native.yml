# Builds the native Quest app (Meta Spatial SDK) into an APK on every push that touches it.
# Download it from the run's Artifacts and install it with: adb install -r maison3d-native-scan.apk
name: native

on:
  push:
    paths:
      - '05-spike-native-scan/**'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-spike-native-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew --no-daemon assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk maison3d-native-scan.apk
      - uses: actions/upload-artifact@v4
        with:
          name: maison3d-native-scan
          path: 05-spike-native-scan/maison3d-native-scan.apk
          if-no-files-found: error
