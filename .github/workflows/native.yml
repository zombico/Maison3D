# Builds the native Quest apps (Meta Spatial SDK) into APKs on every push that touches them.
# Download one from the run's Artifacts and install it with: adb install -r <name>.apk
name: native

on:
  push:
    paths:
      - '05-spike-native-scan/**'
      - '06-spike-native-talk/**'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: 05-spike-native-scan
            apk: maison3d-native-scan
          - dir: 06-spike-native-talk
            apk: maison3d-native-talk
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest ships the Android SDK (ANDROID_HOME); Gradle fetches the platform it needs
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew --no-daemon assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ${{ matrix.apk }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.apk }}
          path: ${{ matrix.dir }}/${{ matrix.apk }}.apk
          if-no-files-found: error
