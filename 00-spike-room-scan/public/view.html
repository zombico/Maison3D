<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maison3D scans</title>
  <style>
    body { margin: 0; padding: 16px; background: #15130f; color: #ece6da; font: 14px/1.5 system-ui, sans-serif; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { color: #b9b1a3; margin: 0 0 12px; }
    select, input { font: inherit; padding: 6px; max-width: 100%; }
    .bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
    svg { background: #0d0c09; border-radius: 8px; width: min(100%, 720px); height: auto; aspect-ratio: 1; }
    pre { background: #0d0c09; padding: 12px; border-radius: 8px; margin: 0; flex: 1 1 280px; overflow: auto; }
    svg text { font: 0.18px system-ui, sans-serif; fill: #ece6da; }
  </style>
</head>
<body>
  <h1>Scans, top down</h1>
  <p>Open scan files downloaded from the headset, or the ones the laptop server received.</p>
  <div class="bar">
    <input type="file" id="files" accept=".json,application/json" multiple>
    <select id="pick"></select>
  </div>
  <div class="row">
    <svg id="plan" viewBox="0 0 10 10"></svg>
    <pre id="info"></pre>
  </div>
  <script type="module">
    import { drawPlan } from './plan.js';

    const pick = document.getElementById('pick');
    const svg = document.getElementById('plan');
    const info = document.getElementById('info');
    const scans = new Map(); // name -> scan, or a URL to fetch it from

    async function show() {
      let scan = scans.get(pick.value);
      if (!scan) return;
      if (typeof scan === 'string') scans.set(pick.value, (scan = await (await fetch(scan)).json()));
      info.textContent = JSON.stringify(drawPlan(svg, scan), null, 2);
    }

    function add(name, scan) {
      if (!scans.has(name)) pick.prepend(new Option(name, name));
      scans.set(name, scan);
    }

    document.getElementById('files').addEventListener('change', async (e) => {
      for (const f of e.target.files) {
        try { add(f.name, JSON.parse(await f.text())); } catch (err) { info.textContent = `${f.name}: ${err.message}`; }
      }
      pick.value = pick.options[0]?.value ?? '';
      show();
    });
    pick.addEventListener('change', show);

    // served by server.mjs: list what it received; anywhere else this just finds nothing
    try {
      const res = await fetch('api/scans');
      if (res.ok) for (const f of (await res.json()).reverse()) add(f, `scans/${encodeURIComponent(f)}`);
    } catch {}
    if (pick.options.length) { pick.value = pick.options[0].value; show(); }
    else info.textContent = 'No scans yet. Download one from the headset page and open it here.';
  </script>
</body>
</html>
